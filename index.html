<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emir Yazılım</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      font-size: 40px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
    }

    .kart {
      background: #1f2937;
      padding: 25px;
      margin: 20px auto;
      max-width: 400px;
      border-radius: 15px;
    }

    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>Emir Yazılım 🚀</h1>

  <p>Web sitesi ve özel yazılım hizmetleri</p>

  <div class="kart">
    <h2>🌐 Web Sitesi</h2>
    <p>İşletmeniz için modern web siteleri.</p>
  </div>

  <div class="kart">
    <h2>🤖 Discord Botu</h2>
    <p>Sunucunuz için özel Discord botları.</p>
  </div>

  <div class="kart">
    <h2>💻 Özel Kodlama</h2>
    <p>İhtiyacınıza göre küçük yazılımlar.</p>
  </div>

  <button>İletişime Geç</button>

</body>
</html>
